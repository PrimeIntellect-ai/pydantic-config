name: Dev release to PyPI

on:
  push:
    branches: [main]

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  release-dev:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      # Version is derived from git tags by hatch-vcs: the last `vX.Y.Z` tag
      # with its final segment bumped, plus `.dev<N>` (N = commits since the
      # tag). E.g. after `v0.4.0` this publishes `0.4.1.dev<N>`.
      - name: Build
        run: uv build

      - name: Show derived version
        run: ls -1 dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
