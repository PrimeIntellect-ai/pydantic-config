name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      # hatch-vcs derives the version from the pushed `vX.Y.Z` tag, so the built
      # artifacts are guaranteed to match the tag — no separate check needed.
      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
